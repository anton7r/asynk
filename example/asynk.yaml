version: 0.0.1

shared:
  # Log level of asynk
  # Most of the time you should not
  # need to set this, as this is by default
  # set to "info".
  log-level: info
  # Can only match folders
  exclude: node_modules

tasks:
  go-build:
    type: build
    run:
      - go build -o app
    include: main.go
  test2:
    type: build
    run:
      - echo Also from second task!
    include: app
    dependencies: [test]
  test:
    type: build
    run:
      - echo Hello
      - echo World!
    include: app
