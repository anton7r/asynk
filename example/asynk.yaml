version: 0.0.1

shared:
  # Log level of asynk
  # Most of the time you should not
  # need to set this, as this is by default
  # set to "info".
  log-level: info
  # Debounces filesystem events before affected tasks are scheduled.
  # Defaults to 200ms. Use 0ms to disable debounce globally.
  fs-debounce: 200ms
  # Optional rebuild suppression skips tasks when matched inputs did not change.
  rebuild-suppression:
    enabled: true
    mode: size-and-hash
    normalize: none
    after-failure: rebuild
  # Can only match folders
  exclude: node_modules

tasks:
  go:
    type: build
    cwd: .
    run:
      command: go
      args: [build, -o, app]
    # Overrides shared.fs-debounce for this task.
    fs-debounce: 500ms
    # Whitespace-only Go source rewrites should not force this example rebuild.
    rebuild-suppression:
      normalize: ignore-whitespace
    include: main.go
  test2:
    type: build
    run:
      command: echo
      args: ["Also from second task!"]
    include: app
    dependencies: [test]
  test:
    type: build
    run:
      - command: echo
        args: [Hello]
      - command: echo
        args: [World!]
    include: app
