version: 0.0.1

shared:
  # NOTE: does not support regex
  excluded-dirs:
    - /vendor
    - /node_modules

  # NOTE: does not support
  excluded-files:
    - /main.go
    - /Dockerfile

  # Controls whether or not changing
  # this configuration file would
  # trigger a reload of the running
  # asynk server
  reload-on-config-change: true
  env-files:
    - .env
  # Debounces filesystem events before affected tasks are scheduled.
  # Defaults to 200ms. Use 0ms to disable debounce globally.
  fs-debounce: 200ms
  # Optional rebuild suppression skips tasks when matched inputs did not change.
  rebuild-suppression:
    enabled: true
    mode: size-and-hash
    normalize: none
    after-failure: rebuild

tasks:
  backend:
    # The task is a long running one, for example an application backend
    type: continuous
    cwd: .
    run:
      command: ./app.exe
    include: ^/app\.exe$
    dependencies:
      - backend-build-task

  backend-build-task:
    # This task builds the backend application
    type: build
    run:
      command: go
      args: [build, -o, ./bin/app.exe]
    # Overrides shared.fs-debounce for this task.
    fs-debounce: 500ms
    rebuild-suppression:
      normalize: ignore-whitespace
    include: ^/.*\.go$
    # This depends on the code generation task
    dependencies:
     - code-gen-run-task

  code-gen-run-task:
    # This task runs the database types code generation
    # NOTE: The script file does not actually exist
    type: build
    # This run commands executes both lines consecutively
    # With the multiline command support we try to reduce
    # the need for shell commands.
    run:
      - command: ./scripts/generate_code_sql_types.sh
      - command: echo
        args: [hello]
    include: ^/schema/.*\.sql$
